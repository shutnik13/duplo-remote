const SERVICE='00001623-1212-efde-1623-785feabcd123',CHAR='00001624-1212-efde-1623-785feabcd123';
const $=id=>document.getElementById(id);let device=null,characteristic=null,currentSpeed=0,lightIndex=0,queue=Promise.resolve(),requested=0,dispatching=false,step=0;const colors=[0,1,7,8,9,10,11,12,13,14,15];
function log(s){$('message').textContent=s;}
function connected(yes){$('connect').classList.toggle('connected',yes);for(const id of ['stop','horn','light'])$(id).disabled=!yes;if(!yes){step=0;drawLever();}}
function write(bytes){const ch=characteristic;if(!ch)return Promise.reject(Error('Нет подключения'));queue=queue.catch(()=>{}).then(async()=>{if(!ch.service.device.gatt.connected)throw Error('Соединение потеряно');const data=new Uint8Array(bytes);if(ch.properties.writeWithoutResponse&&ch.writeValueWithoutResponse)await ch.writeValueWithoutResponse(data);else await ch.writeValue(data)});return queue.catch(e=>{log('Ошибка команды: '+e.message);throw e})}
function motor(n){currentSpeed=n;return write([8,0,0x81,0x32,0x11,0x51,0,n&255])}
function stop(){step=0;requested=0;drawLever();if(characteristic)motor(0).catch(()=>{})}
function disconnect(){characteristic=null;currentSpeed=0;requested=0;connected(false);log('Поезд отключён')}
async function toggleBluetooth(){if(device?.gatt?.connected){stop();try{await queue}catch(e){}device.gatt.disconnect();return}if(!navigator.bluetooth){log('Откройте в Bluefy по HTTPS');return}try{log('Выберите поезд…');device=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}],optionalServices:[SERVICE]});device.addEventListener('gattserverdisconnected',disconnect);const server=await device.gatt.connect();const service=await server.getPrimaryService(SERVICE);characteristic=await service.getCharacteristic(CHAR);connected(true);requested=0;log('Поезд подключён')}catch(e){log('Ошибка: '+e.message);connected(false)}}
function drawLever(){const box=$('leverHousing'),range=Math.max(20,(box.clientHeight-90)/2-10);$('handle').style.top=`calc(50% + ${-step*range/5}px)`;$('power').textContent=Math.abs(step)*10+'%';$('handle').setAttribute('aria-label',step>0?'Вперёд '+step*10+'%':step<0?'Назад '+(-step)*10+'%':'Нейтраль')}
async function flushThrottle(){if(dispatching)return;dispatching=true;try{while(characteristic&&requested!==currentSpeed){await motor(requested)}}catch(e){}finally{dispatching=false}}
function setStep(n){n=Math.max(-5,Math.min(5,n));if(n===step)return;step=n;drawLever();requested=n*10;if(characteristic)flushThrottle()}
const housing=$('leverHousing');let dragId=null;
function moveLever(e){const rect=housing.getBoundingClientRect(),range=Math.max(20,(rect.height-90)/2-10),dy=(rect.top+rect.height/2)-e.clientY;setStep(Math.round(dy/range*5))}
housing.addEventListener('pointerdown',e=>{if(!characteristic)return;e.preventDefault();dragId=e.pointerId;housing.setPointerCapture(e.pointerId);moveLever(e)});housing.addEventListener('pointermove',e=>{if(dragId===e.pointerId)moveLever(e)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])housing.addEventListener(ev,()=>{dragId=null});
$('stop').onclick=stop;
$('horn').onclick=()=>write([11,0,0x81,0x34,0x11,0x51,1,7,1,0,0]).catch(()=>{});
$('light').onclick=()=>{lightIndex=(lightIndex+1)%colors.length;write([11,0,0x81,0x34,0x11,0x51,1,4,1,colors[lightIndex],0]).then(()=>$('light').classList.toggle('on',lightIndex!==0)).catch(()=>{})};
const bt=$('connect');let holdTimer=null,holdStart=0,holdFrame=null;
function clearHold(){if(holdTimer!==null)clearTimeout(holdTimer);holdTimer=null;if(holdFrame!==null)cancelAnimationFrame(holdFrame);holdFrame=null;bt.classList.remove('holding');bt.style.removeProperty('--hold')}
function drawHold(){if(holdTimer===null)return;bt.style.setProperty('--hold',Math.min(1,(performance.now()-holdStart)/2000));holdFrame=requestAnimationFrame(drawHold)}
bt.addEventListener('pointerdown',e=>{if(holdTimer!==null)return;e.preventDefault();holdStart=performance.now();bt.classList.add('holding');try{bt.setPointerCapture(e.pointerId)}catch(_){}holdTimer=setTimeout(()=>{clearHold();toggleBluetooth()},2000);drawHold()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])bt.addEventListener(ev,clearHold);bt.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);window.addEventListener('resize',drawLever);connected(false);drawLever();
</script></body></html>
