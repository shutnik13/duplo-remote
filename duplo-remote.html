<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#85c8ef"><title>Мой поезд — DUPLO 10427</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(#75bee9 0%,#b9e2fa 60%,#e5f6ff 100%);touch-action:manipulation;-webkit-user-select:none;user-select:none}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:active{filter:brightness(.91);transform:translateY(3px)}button:disabled{opacity:.48;filter:grayscale(.5)}.stage{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden}.clouds{position:absolute;bottom:-3%;left:0;width:100%;height:25%;pointer-events:none;opacity:.72}.clouds svg{width:100%;height:100%;display:block}.top{position:absolute;top:5%;left:3%;right:3%;display:flex;justify-content:space-between;align-items:center}.roundIcon{width:clamp(52px,7vw,96px);height:clamp(52px,7vw,96px);border:4px solid white;border-radius:50%;background:#ffffff18;color:white;display:grid;place-items:center}.roundIcon svg{width:63%;height:63%;fill:currentColor}.roundIcon.bluetooth{border-color:#1675ca;color:#1675ca}.roundIcon.bluetooth.connected{border-color:#00a752;color:#00a752;background:#d6ffe45c}.controls{position:absolute;inset:17% 6% 5%;display:grid;grid-template-columns:1fr 1.65fr 1fr;grid-template-rows:42% 58%;align-items:center;justify-items:center;column-gap:5%;row-gap:1%}.tile{width:min(100%,17vw);height:min(100%,31vh);border-radius:22%;border:clamp(7px,1.2vw,19px) solid #e6f6ff;box-shadow:inset 0 4px 4px #ffffff9a,0 10px 0 #0005;display:grid;place-items:center;color:#fff}.tile svg{width:57%;height:57%;stroke:currentColor;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}.light{grid-column:1;grid-row:1;justify-self:end;background:linear-gradient(#eee,#c4c4c4);color:#a8a8a8}.light.on{background:linear-gradient(#fff3a1,#ffc93e);color:#d99200}.horn{grid-column:3;grid-row:1;justify-self:start;background:linear-gradient(#48d4ef,#00a6c8);color:#b3f5ff}.move{grid-row:2;width:min(100%,23vw);height:min(100%,42vh);border-radius:50%;border:clamp(8px,1.5vw,23px) solid #e6f6ff;box-shadow:inset 0 7px 5px #ffffff66,0 8px 0 #0005;background:linear-gradient(#42c981,#00a443);color:#95e4b3;display:grid;place-items:center}.move svg{width:70%;height:70%;stroke:currentColor;stroke-width:11;fill:none;stroke-linecap:round;stroke-linejoin:round}.reverse{grid-column:1;transform:rotate(180deg)}.reverse:active{transform:rotate(180deg) translateY(-3px)}.forward{grid-column:3}.stop{grid-column:2;grid-row:2;width:100%;height:min(85%,33vh);border:clamp(9px,1.6vw,24px) solid #e6f6ff;border-radius:18%;background:linear-gradient(#ff7885,#ed102a);box-shadow:inset 0 0 0 6px #ff9da8,0 10px 0 #0005;color:#ff9ca7;display:grid;place-items:center}.stop svg{width:29%;height:63%;stroke:currentColor;stroke-width:11;stroke-linecap:round}.message{position:absolute;bottom:1%;left:50%;transform:translateX(-50%);max-width:80%;padding:5px 12px;border-radius:12px;background:#ffffffb9;color:#24536b;font-size:clamp(10px,1.2vw,14px);text-align:center;pointer-events:none}.message:empty{display:none}.settings{display:none;position:absolute;inset:12% 12%;z-index:5;background:#ffffffed;border-radius:22px;padding:22px;color:#23536b;overflow:auto;box-shadow:0 12px 60px #17476755}.settings.open{display:block}.settings h2{margin:0 0 14px}.settings input{width:100%}.settings button{padding:12px 20px;background:#1675ca;color:white;border-radius:14px}.settings pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:90px;overflow:auto}.settings p{font-size:13px}.settings label{display:block;margin:12px 0}.hidden{display:none}@media(orientation:portrait){.top{top:3%}.controls{inset:15% 5% 7%;grid-template-columns:1fr 1fr;grid-template-rows:35% 32% 32%;column-gap:5%;row-gap:1%}.tile{width:70%;height:80%}.light{grid-column:1;grid-row:1;justify-self:center}.horn{grid-column:2;grid-row:1;justify-self:center}.move{width:90%;height:90%;grid-row:2}.reverse{grid-column:1}.forward{grid-column:2}.stop{grid-column:1/3;grid-row:3;width:80%;height:85%}.message{font-size:11px}}
</style></head><body><main class="stage"><div class="clouds"><svg viewBox="0 0 1200 170" preserveAspectRatio="none"><path fill="#a4d9f5" d="M0 40 Q55 10 90 60 Q150 40 160 100 Q220 150 280 100 Q340 45 390 95 Q445 25 500 90 Q540 130 570 100 Q600 25 645 85 Q690 120 730 75 Q780 30 820 105 Q900 55 930 110 Q980 20 1040 85 Q1090 25 1150 75 Q1180 25 1200 40 V170 H0Z"/></svg></div><div class="top"><button class="roundIcon" id="home" aria-label="Настройки"><svg viewBox="0 0 64 64"><path d="M6 30 32 8 58 30H50V57H37V40H27V57H14V30Z"/></svg></button><button class="roundIcon bluetooth" id="connect" aria-label="Подключить Bluetooth"><svg viewBox="0 0 64 64" style="fill:none;stroke:currentColor;stroke-width:4;stroke-linejoin:round;stroke-linecap:round"><path d="M31 5 49 21 31 36 49 51 31 61V5M15 17 49 51M15 49 49 21"/></svg></button></div><div class="controls"><button class="tile light" id="light" aria-label="Свет" disabled><svg viewBox="0 0 100 100"><path d="M30 66C30 52 18 49 18 34a32 32 0 0 1 64 0c0 15-12 18-12 32M32 69h36v11H32zM36 85h28"/></svg></button><button class="tile horn" id="horn" aria-label="Гудок" disabled><svg viewBox="0 0 100 100"><path d="M13 44h17l36-23v58L30 56H13zM72 35q20 15 0 30"/><path d="M28 57l7 23h17l-7-18"/></svg></button><button class="move reverse" id="reverse" aria-label="Назад" disabled><svg viewBox="0 0 100 100"><path d="M15 65 50 30 85 65"/></svg></button><button class="stop" id="stop" aria-label="Стоп" disabled><svg viewBox="0 0 100 100"><path d="M25 25 75 75M75 25 25 75"/></svg></button><button class="move forward" id="forward" aria-label="Вперёд" disabled><svg viewBox="0 0 100 100"><path d="M15 65 50 30 85 65"/></svg></button></div><div class="message" id="message"></div><section class="settings" id="settings"><h2>Настройки поезда</h2><label>Скорость: <span id="speedLabel">40%</span><input id="speed" type="range" min="10" max="50" step="5" value="40"></label><p>Максимальная скорость ограничена 50%. Кнопки движения запускают постоянное движение; красная кнопка останавливает поезд.</p><p>При потере Bluetooth или закрытии страницы остановка не гарантируется.</p><pre id="log"></pre><button id="closeSettings">Вернуться к пульту</button></section></main><script>
'use strict';
const SERVICE='00001623-1212-efde-1623-785feabcd123',CHAR='00001624-1212-efde-1623-785feabcd123';
const $=id=>document.getElementById(id);let device=null,characteristic=null,currentSpeed=0,lightIndex=0,queue=Promise.resolve();const colors=[0,1,7,8,9,10,11,12,13,14,15];
function log(s){$('log').textContent=s+'\n'+$('log').textContent.slice(0,500);$('message').textContent=s;}
function connected(yes){$('connect').classList.toggle('connected',yes);$('connect').setAttribute('aria-label',yes?'Отключить Bluetooth':'Подключить Bluetooth');for(const id of ['forward','reverse','stop','horn','light'])$(id).disabled=!yes;}
function write(bytes){const ch=characteristic;if(!ch)return Promise.reject(Error('Нет подключения'));queue=queue.catch(()=>{}).then(async()=>{if(!ch.service.device.gatt.connected)throw Error('Соединение потеряно');const data=new Uint8Array(bytes);if(ch.properties.writeWithoutResponse&&ch.writeValueWithoutResponse)await ch.writeValueWithoutResponse(data);else await ch.writeValue(data)});return queue.catch(e=>{log('Ошибка команды: '+e.message);throw e})}
function motor(n){currentSpeed=n;return write([8,0,0x81,0x32,0x11,0x51,0,n&255])}
function stop(){if(characteristic)motor(0).catch(()=>{})}
function disconnect(){connected(false);characteristic=null;currentSpeed=0;log('Поезд отключён')}
$('connect').onclick=async()=>{if(device?.gatt?.connected){stop();try{await queue}catch(e){}device.gatt.disconnect();return}if(!navigator.bluetooth){log('Web Bluetooth недоступен. Откройте страницу в Bluefy по HTTPS.');return}try{log('Выберите поезд в Bluetooth…');device=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}],optionalServices:[SERVICE]});device.addEventListener('gattserverdisconnected',disconnect);const server=await device.gatt.connect();const service=await server.getPrimaryService(SERVICE);characteristic=await service.getCharacteristic(CHAR);connected(true);log('Поезд подключён')}catch(e){log('Ошибка подключения: '+e.message);connected(false)}};
$('speed').oninput=()=>{$('speedLabel').textContent=$('speed').value+'%';if(currentSpeed!==0)motor(Math.sign(currentSpeed)*Number($('speed').value)).catch(()=>{})};
$('forward').onclick=()=>motor(Number($('speed').value)).catch(()=>{});
$('reverse').onclick=()=>motor(-Number($('speed').value)).catch(()=>{});
$('stop').onclick=stop;
$('horn').onclick=()=>write([11,0,0x81,0x34,0x11,0x51,1,7,1,0,0]).catch(()=>{});
$('light').onclick=()=>{lightIndex=(lightIndex+1)%colors.length;write([11,0,0x81,0x34,0x11,0x51,1,4,1,colors[lightIndex],0]).then(()=>$('light').classList.toggle('on',lightIndex!==0)).catch(()=>{})};
$('home').onclick=()=>$('settings').classList.add('open');$('closeSettings').onclick=()=>$('settings').classList.remove('open');document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);connected(false);
</script></body></html>
